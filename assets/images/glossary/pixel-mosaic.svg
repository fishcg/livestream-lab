<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">由瓷砖组成的马赛克画</title>
  <desc id="desc">远看是一艘橙色帆船，放大镜里能看到组成图案的独立瓷砖格子。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17323a"/><stop offset="1" stop-color="#0b1419"/></linearGradient>
    <pattern id="tiles" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#f1eee7" stroke-opacity=".3" stroke-width="2"/></pattern>
    <clipPath id="picture"><rect x="42" y="42" width="390" height="276" rx="8"/></clipPath>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="640" height="360" fill="#101419"/>
  <g filter="url(#shadow)">
    <rect x="42" y="42" width="390" height="276" rx="8" fill="url(#wall)"/>
    <g clip-path="url(#picture)">
      <rect x="42" y="42" width="390" height="170" fill="#36a9bb"/>
      <rect x="42" y="212" width="390" height="106" fill="#0e6777"/>
      <circle cx="122" cy="108" r="36" fill="#f6d36c"/>
      <path d="M176 229h164l-27 42H201z" fill="#ff6a2a"/>
      <path d="M251 85v144h-11V85z" fill="#f2efe8"/>
      <path d="M251 96l76 111h-76z" fill="#f5f1e8"/>
      <path d="M239 120l-55 86h55z" fill="#ffb077"/>
      <path d="M42 250c52-20 85 16 128 0s80 15 124 0 87 13 138-4v72H42z" fill="#094b59"/>
      <rect x="42" y="42" width="390" height="276" fill="url(#tiles)"/>
    </g>
  </g>
  <path d="M425 130c41 10 61 34 77 65" fill="none" stroke="#ff6a2a" stroke-width="4" stroke-dasharray="8 9"/>
  <g filter="url(#shadow)">
    <circle cx="522" cy="220" r="91" fill="#f2efe8" stroke="#ff6a2a" stroke-width="8"/>
    <g transform="translate(465 163)">
      <rect width="38" height="38" rx="4" fill="#f5f1e8"/><rect x="40" width="38" height="38" rx="4" fill="#f5f1e8"/><rect x="80" width="38" height="38" rx="4" fill="#36a9bb"/>
      <rect y="40" width="38" height="38" rx="4" fill="#ffb077"/><rect x="40" y="40" width="38" height="38" rx="4" fill="#ff6a2a"/><rect x="80" y="40" width="38" height="38" rx="4" fill="#f5f1e8"/>
      <rect y="80" width="38" height="38" rx="4" fill="#0e6777"/><rect x="40" y="80" width="38" height="38" rx="4" fill="#ff6a2a"/><rect x="80" y="80" width="38" height="38" rx="4" fill="#094b59"/>
    </g>
    <path d="M585 285l42 42" stroke="#ff6a2a" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
