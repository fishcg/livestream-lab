  <rect width="640" height="360" fill="url(#bg)"/>
  <g transform="translate(50 70)">
    <path d="M0 0h145l-40 90H40z" fill="#263039" stroke="#58636d" stroke-width="4"/>
    <g fill="#45d5e8"><rect x="18" y="16" width="18" height="18"/><rect x="48" y="10" width="23" height="23"/><rect x="84" y="20" width="17" height="17"/><rect x="114" y="8" width="22" height="22"/><rect x="37" y="46" width="20" height="20"/><rect x="76" y="48" width="25" height="25"/></g>
    <path d="M73 90v70h80" fill="none" stroke="#68737c" stroke-width="45" stroke-linejoin="round"/>
    <path d="M73 90v70h80" fill="none" stroke="#12181d" stroke-width="35" stroke-linejoin="round"/>
    <path d="M153 160h357" stroke="#68737c" stroke-width="74"/>
    <path d="M153 160h357" stroke="#12181d" stroke-width="60"/>
    <g fill="#ff6a2a" filter="url(#glow)"><rect x="139" y="146" width="25" height="25" rx="3"/><rect x="184" y="144" width="30" height="30" rx="3"/><rect x="236" y="148" width="22" height="22" rx="3"/><rect x="279" y="142" width="32" height="32" rx="3"/><rect x="335" y="147" width="24" height="24" rx="3"/><rect x="380" y="143" width="31" height="31" rx="3"/><rect x="436" y="147" width="24" height="24" rx="3"/></g>
    <path d="M510 105l65 55-65 55z" fill="#a6ef67"/>
  </g>
  <g transform="translate(180 285)" fill="#69747d"><circle r="4"/><circle cx="40" r="4"/><circle cx="80" r="4"/><circle cx="120" r="4"/><circle cx="160" r="4"/><circle cx="200" r="4"/><circle cx="240" r="4"/></g>
